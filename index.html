  const recent=E.filter(e=>(e.type==="symptom"||e.type==="overnight")&&new Date(e.ts).getTime()>d3);
  const older=E.filter(e=>(e.type==="symptom"||e.type==="overnight")&&new Date(e.ts).getTime()<=d3&&new Date(e.ts).getTime()>d3-3*86400000);
  const rAvg=recent.length>0?recent.reduce((a,e)=>a+(e.sev||0),0)/recent.length:0;
  const oAvg=older.length>0?older.reduce((a,e)=>a+(e.sev||0),0)/older.length:0;
  const rBM=recent.filter(e=>e.stool).length;const oBM=older.filter(e=>e.stool).length;
  const worsening=rAvg>oAvg+0.5||rBM>oBM+2;
  const improving=rAvg<oAvg-0.3;

}
